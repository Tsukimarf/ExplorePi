name: CI

on:
  push:
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: api/package-lock.json }
      - run: npm install
      - run: npm test

  go-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/go-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go test ./...

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pq-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: [node-tests, go-tests, python-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan .env
        run: |
          cat > .env <<ENV
          POSTGRES_PASSWORD=${{ secrets.CI_POSTGRES_PASSWORD || 'ci-only-password' }}
          APP_DB_PASSWORD=${{ secrets.CI_APP_DB_PASSWORD || 'ci-only-app-password' }}
          BLIND_INDEX_KEY=${{ secrets.CI_BLIND_INDEX_KEY || 'ci-only-blind-index-key' }}
          INTERNAL_TOKEN=${{ secrets.CI_INTERNAL_TOKEN || 'ci-only-internal-token' }}
          ENV
      - run: ./test/e2e.sh
