# PostgreSQL 16 - ExplorePi (tuning untuk server kecil, ~1 GB RAM)
listen_addresses = '*'
port = 5432
hba_file = '/etc/postgresql/pg_hba.conf'

# koneksi & auth
max_connections = 100
password_encryption = scram-sha-256

# memori
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB

# WAL & checkpoint
wal_level = replica
max_wal_size = 1GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1

# waktu
timezone = 'UTC'
log_timezone = 'UTC'

# logging
log_destination = 'stderr'
log_min_duration_statement = 500     # log query > 500 ms
log_statement = 'ddl'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d '

# TLS: nonaktif karena DB hanya di jaringan docker internal.
# Jika DB diakses lewat jaringan luar, aktifkan ssl=on + ssl_cert_file/ssl_key_file.
ssl = off
